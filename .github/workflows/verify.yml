name: Verify Windows baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Validate documentation inputs
        run: ./scripts/check.ps1

  compile:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/out/deps/vcpkg/binary-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CMake and Ninja
        run: python -m pip install cmake==4.3.4 ninja==1.13.2
      - uses: ilammy/setup-nasm@v1
        with:
          version: '3.01'
      - name: Prepare dependency cache
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v4
        with:
          path: |
            out/deps/vcpkg/binary-cache
            out/deps/vcpkg/downloads
          key: vcpkg-windows-x64-${{ hashFiles('src/OpenLR2/vcpkg*.json', 'src/OpenLR2/CMakePresets.json') }}
      - name: Compile frontend and engine without private LR2 resources
        run: ./build.cmd -CompileOnly -Jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: LazerRave-Windows-x64-Compile-Outputs
          path: |
            out/build/client/bin/Release/net10.0-windows/win-x64/
            out/build/engine/windows-vs-x64/RelWithDebInfo/
          if-no-files-found: error
          retention-days: 7
